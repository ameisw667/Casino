# Minimale deklarative Kong-Konfiguration für den isolierten Chaos-Stack.
# Routet /auth, /rest, /realtime, /storage an die jeweiligen internen Services.
# Vor echtem Deployment gegen die aktuelle Referenz-Config im offiziellen
# supabase/docker-Repo abgleichen (siehe Hinweis in docker-compose.yml).

_format_version: "2.1"

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/

  - name: realtime-v1
    url: http://realtime:4000/socket/
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1/

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
