name: Security staging regression

# Redesigned 2026-08-28 (worldmap/00-09-CICD.md, M9 — decided with Jan: ephemeral local Supabase
# instead of a persistent cloud staging project, to avoid the cost/secret-maintenance overhead of a
# real second Supabase instance for a solo project). `supabase start` runs the same local Docker
# stack Jan uses locally (npm run supabase:start), applies supabase/migrations/**, and is torn down
# with the runner — no cloud account, no GitHub secrets, nothing to rotate.
#
# Known interaction (updated 2026-08-29, docs/archive/06_4_security_ci_gate_hardening_plan.md L1/L5): the historical
# failure (`ERROR: duplicate key value violates unique constraint "schema_migrations_pkey" ...
# Key (version)=(049) already exists`, run 33210240496, 2026-08-28) was a real filename-number
# collision, tracked in docs/archive/05_datenbank_haertung.md (Kategorie 02/09, outside this
# category's scope). As of 2026-08-29 the working tree no longer has that collision
# (`ls supabase/migrations | sed -E 's/_.*//' | sort | uniq -d` is empty) — the fix exists locally
# but is not yet committed/pushed, so this workflow is expected to go green on the next run after
# that commit lands. If a future run still fails at "Applying migration", re-check for a *new*
# collision with the same command before assuming this workflow itself is broken.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-security-phase1.sql'
      - 'scripts/phase1-*.ts'
      - 'src/lib/casino/**'
      - 'src/lib/security/**'

permissions:
  contents: read

jobs:
  security-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHA 2026-08-29 (worldmap/04_07_dependency_audit_gate.md L4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      - name: Start ephemeral local Supabase
        run: npx supabase start

      - name: Export local Supabase connection vars
        run: |
          npx supabase status -o env > .supabase-status.env
          # Supabase CLI emits shell-quoted values. Source its own generated env file so
          # the GITHUB_ENV values do not retain literal quote characters.
          set -a
          source .supabase-status.env
          set +a
          {
            echo "PHASE1_STAGING_URL=$API_URL"
            echo "PHASE1_STAGING_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PHASE1_STAGING_DATABASE_URL=$DB_URL"
            echo "PHASE1_TARGET_CONFIRMED=true"
            echo "PHASE1_EPHEMERAL_LOCAL=true"
          } >> "$GITHUB_ENV"
          rm .supabase-status.env

      - run: npm test -- src/lib/security/__tests__/staging-regression-contract.test.ts
      - run: npx tsx scripts/phase1-target-guard.ts
      - run: psql "$PHASE1_STAGING_DATABASE_URL" -v phase1_target_confirmed="$PHASE1_TARGET_CONFIRMED" -f scripts/verify-security-phase1.sql
      - run: npx tsx scripts/phase1-concurrency.ts

      - name: Stop ephemeral local Supabase
        if: always()
        run: npx supabase stop

      # worldmap/04_02_security_ci_gate.md L3 — a red run was previously only visible to someone
      # actively checking the Actions tab. This writes a short, readable summary so a failure is
      # legible directly from the run page without opening raw logs. Native GitHub Actions feature
      # ($GITHUB_STEP_SUMMARY), no new secret, no external notification channel.
      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "## Security staging regression failed"
            echo ""
            echo "Check the failed step's log above for the exact error."
            echo "If it fails while applying a migration (\"duplicate key value violates unique"
            echo "constraint\"), that's a migration filename-number collision — see"
            echo "[docs/archive/05_datenbank_haertung.md](../../blob/main/docs/archive/05_datenbank_haertung.md)"
            echo "before assuming this workflow itself is broken."
          } >> "$GITHUB_STEP_SUMMARY"
