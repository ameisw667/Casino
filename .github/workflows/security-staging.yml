name: Security staging regression

# Redesigned 2026-08-28 (worldmap/00-09-CICD.md, M9 — decided with Jan: ephemeral local Supabase
# instead of a persistent cloud staging project, to avoid the cost/secret-maintenance overhead of a
# real second Supabase instance for a solo project). `supabase start` runs the same local Docker
# stack Jan uses locally (npm run supabase:start), applies supabase/migrations/**, and is torn down
# with the runner — no cloud account, no GitHub secrets, nothing to rotate.
#
# Known interaction (updated 2026-08-29, docs/archive/06_4_security_ci_gate_hardening_plan.md L1/L5): the historical
# failure (`ERROR: duplicate key value violates unique constraint "schema_migrations_pkey" ...
# Key (version)=(049) already exists`, run 33210240496, 2026-08-28) was a real filename-number
# collision, tracked in docs/archive/05_datenbank_haertung.md (Kategorie 02/09, outside this
# category's scope). As of 2026-08-29 the working tree no longer has that collision
# (`ls supabase/migrations | sed -E 's/_.*//' | sort | uniq -d` is empty) — the fix exists locally
# but is not yet committed/pushed, so this workflow is expected to go green on the next run after
# that commit lands. If a future run still fails at "Applying migration", re-check for a *new*
# collision with the same command before assuming this workflow itself is broken.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/verify-security-phase1.sql'
      - 'scripts/phase1-*.ts'
      - 'src/lib/casino/**'
      - 'src/lib/security/**'

permissions:
  contents: read

concurrency:
  # 06_7 L1 (R4): same ephemeral local Supabase stack as red-team-security.yml (fixed local
  # ports) — a push-triggered run colliding with a manual workflow_dispatch would otherwise
  # race for that stack. Same pattern as quality-ci.yml.
  group: security-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHA 2026-08-29 (worldmap/04_07_dependency_audit_gate.md L4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # docs/security-hardening/07_dependency_supply_chain_audit.md L1 (Runde 2): ignore-scripts=true
      # in .npmrc means `npm ci` above no longer auto-runs any lifecycle script. This runs the
      # allowlisted dependency scripts (package.json > lavamoat.allowScripts) and, as a side effect
      # of allow-scripts re-invoking the root package's own lifecycle events, husky's git-hooks setup.
      - run: npm run allow-scripts

      # T_SECURITY_HARDENING/02_security_ci_gate.md L2 (2026-09-12): `npx supabase start` pulls
      # ~1.5-2 GB of Supabase stack Docker images (postgres, kong, gotrue, postgrest, ...) on every
      # run. Cache the image set between runs, keyed on the pinned Supabase CLI version from
      # package.json — a CLI bump changes which image tags get pulled, so the key changes too.
      # Isolation guarantee is NOT diluted: only the immutable Docker images are cached, never any
      # database state — every run still starts from an empty volume with all migrations applied
      # fresh by `supabase start`. Both security workflows share this key so whichever runs first
      # populates it for both (GitHub caches are repo- and branch-scoped, not workflow-scoped).
      - id: supabase-version
        run: echo "version=$(npx supabase --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      - id: supabase-images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/supabase-images.tar
          key: supabase-docker-images-${{ runner.os }}-${{ steps.supabase-version.outputs.version }}

      - name: Load cached Supabase Docker images
        run: if [ -f /tmp/supabase-images.tar ]; then docker load -i /tmp/supabase-images.tar; fi

      - name: Start ephemeral local Supabase
        run: npx supabase start

      # ubuntu-latest runners ship with no pre-pulled Docker images, so after `supabase start` the
      # image list is exactly the Supabase stack. Only saved on a cache miss (otherwise the tar
      # already holds this exact image set and re-saving it would be wasted upload time). The
      # cache action's post-job save step then uploads the tar for the next run.
      - name: Save Supabase Docker images for the next run
        if: always() && steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>')
          if [ -n "$images" ]; then
            docker save $images -o /tmp/supabase-images.tar
          fi

      - name: Export local Supabase connection vars
        run: |
          npx supabase status -o env > .supabase-status.env
          # Supabase CLI emits shell-quoted values. Source its own generated env file so
          # the GITHUB_ENV values do not retain literal quote characters.
          set -a
          source .supabase-status.env
          set +a
          {
            echo "PHASE1_STAGING_URL=$API_URL"
            echo "PHASE1_STAGING_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PHASE1_STAGING_DATABASE_URL=$DB_URL"
            echo "PHASE1_TARGET_CONFIRMED=true"
            echo "PHASE1_EPHEMERAL_LOCAL=true"
          } >> "$GITHUB_ENV"
          rm .supabase-status.env

      # T_DATABASE/10 N4 — Coverage-Check (Inventar vs. supabase/tests/*.sql) VOR dem
      # DB-Lauf. Lücken blockieren den Workflow nicht, sondern fallen als roter Step auf.
      - name: Check pgTAP P0 coverage
        continue-on-error: true
        run: npx tsx scripts/check-pgtap-coverage.ts

      # T_DATABASE/10 L8 — pgTAP-Laufzeittests (supabase/tests/*.sql) gegen dieselbe
      # ephemere lokale Supabase-Instanz. `supabase start` hat bereits alle Migrationen
      # inkl. 064_enable_pgtap.sql angewendet, daher läuft die Suite direkt danach.
      - name: Run pgTAP database tests
        run: npx supabase test db

      # T_DATABASE/10 N5 — echter Konkurrenztest der Advisory-Lock-Pfade (2 gleichzeitige
      # service_role-Clients, gleiche request_id) gegen dieselbe ephemere lokale Instanz.
      - name: Run concurrent settlement race test
        run: npx tsx scripts/test-concurrent-settlement.ts

      - run: npm test -- src/lib/security/__tests__/staging-regression-contract.test.ts
      - run: npx tsx scripts/phase1-target-guard.ts
      - run: psql "$PHASE1_STAGING_DATABASE_URL" -v phase1_target_confirmed="$PHASE1_TARGET_CONFIRMED" -f scripts/verify-security-phase1.sql
      - run: npx tsx scripts/phase1-concurrency.ts

      - name: Stop ephemeral local Supabase
        if: always()
        run: npx supabase stop

      # worldmap/04_02_security_ci_gate.md L3 — a red run was previously only visible to someone
      # actively checking the Actions tab. This writes a short, readable summary so a failure is
      # legible directly from the run page without opening raw logs. Native GitHub Actions feature
      # ($GITHUB_STEP_SUMMARY), no new secret, no external notification channel.
      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "## Security staging regression failed"
            echo ""
            echo "Check the failed step's log above for the exact error."
            echo "If it fails while applying a migration (\"duplicate key value violates unique"
            echo "constraint\"), that's a migration filename-number collision — see"
            echo "[docs/archive/05_datenbank_haertung.md](../../blob/main/docs/archive/05_datenbank_haertung.md)"
            echo "before assuming this workflow itself is broken."
          } >> "$GITHUB_STEP_SUMMARY"

      # T_SECURITY_HARDENING/08_secret_rotation_prozess.md L4 — `npm run check-secret-rotation`
      # (scripts/check-secret-rotation-due.ts) existed but ran nowhere automated, so an overdue
      # secret was only visible to someone running it locally. This makes the current status
      # visible directly on this already security-relevant, regularly-running workflow's run page.
      # Deliberately advisory only (`|| true`, `if: always()`) — rotation itself stays a K5/Jan
      # action (xx_sop/14_secret_rotation.md §0), so this must never become a merge-blocking gate.
      - name: Secret rotation status (advisory only)
        if: always()
        run: |
          {
            echo "## Secret rotation status (informational, not a CI gate)"
            echo ""
            echo "Rotation itself is always a K5 (Jan) action — this only surfaces what"
            echo "[xx_docs/13_secret_rotation_log.md](../../blob/main/xx_docs/13_secret_rotation_log.md) currently shows."
            echo ""
            echo '```'
            npm run check-secret-rotation || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
