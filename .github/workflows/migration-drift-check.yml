name: Migration Drift Check

# Wöchentlicher, rein informativer Check (kein PR-Blocker, siehe T_DATABASE/01_migrations_disziplin L3):
# gleicht lokale Migrationsdateien gegen die Remote-Historie ab, damit Drift nicht erst beim
# manuellen `npm run supabase:migrations` vor einem Push auffällt. Analog doc-drift-check.yml
# (informativ statt blockierend, da Drift zwischen Entwicklungsphasen beabsichtigt sein kann).
# Benötigt das GitHub-Secret SUPABASE_ACCESS_TOKEN (read-only Nutzung); ohne Secret läuft der
# Job mit sichtbarem Skip-Hinweis durch statt zu failen.

on:
  schedule:
    - cron: '17 5 * * 1' # montags 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
      - name: Skip-Hinweis, wenn Token nicht konfiguriert
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          {
            echo "## Migration-Drift-Check übersprungen"
            echo ""
            echo "Das GitHub-Secret \`SUPABASE_ACCESS_TOKEN\` ist nicht hinterlegt. Einmalig anlegen"
            echo "(read-only Access-Token des Supabase-Projekts), danach läuft dieser Check wöchentlich automatisch."
            echo "Siehe \`T_DATABASE/01_database_migrations_disziplin.md\` L3."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lokale vs. Remote-Migrationen vergleichen
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          npx supabase link --project-ref hmqwozhdckbwjqzcmire
          npx supabase migration list --linked > migration-list.json
          node -e '
          const fs = require("fs");
          const raw = fs.readFileSync("migration-list.json", "utf8");
          const data = JSON.parse(raw.slice(raw.indexOf("{")));
          const drift = data.migrations.filter((m) => m.local !== m.remote);
          const lines = [
            "## Migration-Drift-Check (informativ, nicht blockierend)",
            "",
            "Verglichene Einträge: " + data.migrations.length,
            "",
          ];
          if (drift.length === 0) {
            lines.push("✅ Lokal und Remote synchron.");
          } else {
            lines.push("⚠️ **Drift erkannt** (local ≠ remote):");
            for (const d of drift) lines.push("- `" + d.local + " | " + d.remote + "`");
            lines.push("", "Drift zwischen Entwicklungsphasen kann beabsichtigt sein — gegen `npm run supabase:migrations` bewerten, nicht blockieren.");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '