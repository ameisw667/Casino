name: Migration Drift Check

# Wöchentlicher, rein informativer Check (kein PR-Blocker, siehe T_DATABASE/01_migrations_disziplin L3):
# gleicht lokale Migrationsdateien gegen die Remote-Historie ab, damit Drift nicht erst beim
# manuellen `npm run supabase:migrations` vor einem Push auffällt. Analog doc-drift-check.yml
# (informativ statt blockierend, da Drift zwischen Entwicklungsphasen beabsichtigt sein kann).
# Benötigt das GitHub-Secret SUPABASE_ACCESS_TOKEN (granulares Token mit Database-/
# Migrations-Read-Rechten, read-only Nutzung); ohne Secret läuft der Job mit sichtbarem
# Skip-Hinweis durch statt zu failen.
#
# Bewusst KEIN `supabase link`/`migration list` (CLI): die CLI akzeptiert granulare
# Access-Tokens für link nicht (supabase/cli#6392) — der Abgleich läuft direkt gegen
# den Management-API-Endpoint GET /v1/projects/{ref}/database/migrations.

on:
  schedule:
    - cron: '17 5 * * 1' # montags 05:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
      - name: Skip-Hinweis, wenn Token nicht konfiguriert
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          {
            echo "## Migration-Drift-Check übersprungen"
            echo ""
            echo "Das GitHub-Secret \`SUPABASE_ACCESS_TOKEN\` ist nicht hinterlegt. Einmalig anlegen"
            echo "(granulares Access-Token des Supabase-Projekts mit Database-/Migrations-Read),"
            echo "danach läuft dieser Check wöchentlich automatisch."
            echo "Siehe \`T_DATABASE/01_database_migrations_disziplin.md\` L3."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Lokale vs. Remote-Migrationen vergleichen
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: |
          node -e '
          (async () => {
            const fs = require("fs");
            const response = await fetch(
              "https://api.supabase.com/v1/projects/hmqwozhdckbwjqzcmire/database/migrations",
              { headers: { Authorization: "Bearer " + process.env.SUPABASE_ACCESS_TOKEN } },
            );
            if (!response.ok) {
              throw new Error("Management-API /database/migrations fehlgeschlagen: HTTP " + response.status + " — " + await response.text());
            }
            const remote = (await response.json()).map((m) => String(m.id));
            const local = fs.readdirSync("supabase/migrations", { withFileTypes: true })
              .filter((entry) => entry.isFile() && entry.name.endsWith(".sql"))
              .map((entry) => entry.name.split("_")[0]);
            const localOnly = local.filter((v) => !remote.includes(v));
            const remoteOnly = remote.filter((v) => !local.includes(v));
            const lines = [
              "## Migration-Drift-Check (informativ, nicht blockierend)",
              "",
              "Verglichene Einträge: lokal " + local.length + " / remote " + remote.length,
              "",
            ];
            if (localOnly.length === 0 && remoteOnly.length === 0) {
              lines.push("✅ Lokal und Remote synchron.");
            } else {
              lines.push("⚠️ **Drift erkannt**:");
              if (localOnly.length > 0) lines.push("- Nur lokal (remote noch nicht angewendet): " + localOnly.join(", "));
              if (remoteOnly.length > 0) lines.push("- Nur remote (lokal nicht committet): " + remoteOnly.join(", "));
              lines.push("", "Drift zwischen Entwicklungsphasen kann beabsichtigt sein — gegen `npm run supabase:migrations` bewerten, nicht blockieren.");
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          })().catch((error) => { console.error(error); process.exit(1); });
          '