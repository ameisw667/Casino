name: Quality CI

# Specification frozen 2026-08-23 by Jan (docs/archive/06_ci_cd_versioncontrol.md, decisions Q1-Q8),
# implemented 2026-08-28 (worldmap/00-09-CICD.md, M1). Secret-free quality gate: test, typecheck,
# lint, build. Required status check for branch protection (M2, separate Jan-approved step).
# Doc-link-check step added 2026-08-29 (worldmap/00-14-DokuSync.md, M6) — extends this existing,
# already-approved gate rather than introducing a new local pre-commit gate (see M6/L0 for rationale).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHA 2026-08-29 (worldmap/04_07_dependency_audit_gate.md L4) — a mutable
      # tag (e.g. @v4) could be repointed to different code without this file changing; this is a
      # mechanical supply-chain hardening only, it does not reopen the frozen Q1-Q8 gate decisions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Migration number collision backstop (T_DATABASE/01_migrations_disziplin L2, 2026-09-05):
      # mirrors .husky/pre-commit, which is bypassable via --no-verify or GitHub web edits.
      # Same command as the hook; fails the PR on a duplicate migration prefix. No secret needed.
      - name: Migration number collision check
        run: |
          collisions=$(ls supabase/migrations | sed -E 's/_.*//' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "Migrations-Nummernkollision gefunden: $collisions" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      # docs/security-hardening/07_dependency_supply_chain_audit.md L1 (Runde 2): ignore-scripts=true
      # in .npmrc means `npm ci` above no longer auto-runs any lifecycle script. This runs the
      # allowlisted dependency scripts (package.json > lavamoat.allowScripts) and, as a side effect
      # of allow-scripts re-invoking the root package's own lifecycle events, husky's git-hooks setup.
      - run: npm run allow-scripts
      - run: npm test
      # 06_4 (T7/L2, 2026-09-06): observability-only coverage report for the Rate-Limiting/
      # Abuse-Prevention scope (vitest.config.ts coverage.include). Deliberately non-blocking —
      # it supplements the npm test gate above and is not a hard coverage gate yet (plan Q2:
      # observe first, decide on a hard gate later). Pre-existing threshold misses outside that
      # scope (sentry-scrub, useCasinoStore, wallet) must not fail this PR.
      - run: npm run test:coverage -- --coverage.reporter=json-summary
        continue-on-error: true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check-doc-links
      # 03a-R07 duplication growth gate: warn-level only for the first runs —
      # observe false-positive rate before deciding on a hard gate (fail-soft transition).
      - run: npm run check-duplication
        continue-on-error: true
      # 03a-R10 file-size guardrail: hard gate at the coding-style 800-line limit
      # (grandfathered legacy files warn, new oversize files fail the run).
      - run: npm run check-file-sizes
      - run: npm run build
      # Inline-style regression gate (T_SECURITY_HARDENING/01_csp_script_hardening.md L4,
      # 2026-09-12): the script itself exits 1 on unbounded style-src: unsafe-inline growth;
      # surfaced as a non-blocking job-summary note so it informs without breaking unrelated PRs
      # — the baseline file is the conscious opt-in mechanism for growth.
      - name: Inline-style baseline check
        continue-on-error: true
        run: |
          if ! node scripts/check-inline-style-baseline.mjs; then
            {
              echo "### ⚠️ Inline-style baseline exceeded"
              echo ""
              echo "\`style={{\` count grew beyond scripts/inline-style-baseline.json without a"
              echo "conscious baseline update (style-src 'unsafe-inline' regression gate,"
              echo "T_SECURITY_HARDENING/01 L4). Intentional growth? Update the baseline file"
              echo "with the new count and a one-line reason in the same change."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
