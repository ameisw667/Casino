name: Quality CI

# Specification frozen 2026-08-23 by Jan (docs/archive/06_ci_cd_versioncontrol.md, decisions Q1-Q8),
# implemented 2026-08-28 (worldmap/00-09-CICD.md, M1). Secret-free quality gate: test, typecheck,
# lint, build. Required status check for branch protection (M2, separate Jan-approved step).
# Doc-link-check step added 2026-08-29 (worldmap/00-14-DokuSync.md, M6) — extends this existing,
# already-approved gate rather than introducing a new local pre-commit gate (see M6/L0 for rationale).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHA 2026-08-29 (worldmap/04_07_dependency_audit_gate.md L4) — a mutable
      # tag (e.g. @v4) could be repointed to different code without this file changing; this is a
      # mechanical supply-chain hardening only, it does not reopen the frozen Q1-Q8 gate decisions.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Migration number collision backstop (T_DATABASE/01_migrations_disziplin L2, 2026-09-05):
      # mirrors .husky/pre-commit, which is bypassable via --no-verify or GitHub web edits.
      # Same command as the hook; fails the PR on a duplicate migration prefix. No secret needed.
      - name: Migration number collision check
        run: |
          collisions=$(ls supabase/migrations | sed -E 's/_.*//' | sort | uniq -d)
          if [ -n "$collisions" ]; then
            echo "Migrations-Nummernkollision gefunden: $collisions" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check-doc-links
      - run: npm run build
