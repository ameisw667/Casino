name: Quality CI

# Specification frozen 2026-08-23 by Jan (docs/archive/06_ci_cd_versioncontrol.md, decisions Q1-Q8),
# implemented 2026-08-28 (worldmap/00-09-CICD.md, M1). Secret-free quality gate: test, typecheck,
# lint, build. Required status check for branch protection (M2, separate Jan-approved step).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
