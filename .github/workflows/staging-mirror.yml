name: Mirror main to staging

# 05_1.13: the "staging" branch exists solely as an Uptime Kuma monitoring target
# (see worldmap/05_1.13_Uptime-Kuma-Monitoring.md §5.3/§6/R5) — it must never diverge
# from main via manual commits (that risk is documented, see architecture review
# finding A6). This keeps it a pure fast-forward mirror instead: every push to main
# force-updates staging to the exact same commit, so nothing ever needs to be pushed
# to staging by hand for routine development.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push origin HEAD:refs/heads/staging --force-with-lease
