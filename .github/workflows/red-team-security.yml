name: Security red team probes

# Redesigned 2026-08-28 (worldmap/00-09-CICD.md, M9 — same ephemeral-local-Supabase decision as
# security-staging.yml). Runs the app via `next dev` rather than a production build: the fail-closed
# rate-limit behavior in src/lib/security/request-security.ts (enforceRateLimit) only serves 503s
# once NODE_ENV=production and no Upstash is configured, which would make rate-limit-bypass.ts's
# probe meaningless in an ephemeral runner with no real Upstash instance. Dev mode uses the same
# tested in-memory rate-limit fallback Jan already relies on locally.
#
# PHASE1_STAGING_URL uses `localhost`, not `127.0.0.1` (2026-08-30 fix): validateMutationOrigin()
# in src/lib/security/request-security.ts falls back to `new URL(request.url).origin` in
# non-production, and Next.js's dev server reports its own request.url using the hostname it was
# started with (`next dev` logs "- Local: http://localhost:3015"). Sending an `Origin` header of
# `http://127.0.0.1:3015` against that never matches, so every mutating request got a 403
# PERMISSION_DENIED before reaching auth/rate-limiting — confirmed via a raw curl showing the JSON
# error body (route-level validateMutationOrigin, not the separate proxy.ts hasValidOrigin check,
# which was already passing).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_ADMIN_EMAIL: ci-red-team-admin@ephemeral.test

jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHA 2026-08-29 (worldmap/04_07_dependency_audit_gate.md L4), matching
      # quality-ci.yml and security-staging.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      # T_SECURITY_HARDENING/02_security_ci_gate.md L2 (2026-09-12): identical image cache as
      # security-staging.yml — same key, so whichever of the two security workflows runs first
      # populates the image set for both. Only the immutable Docker images are cached, never any
      # database state: every run still starts from an empty volume and applies all migrations
      # fresh, so the ephemeral-stack isolation guarantee is unchanged. This edit is deliberately
      # additive to the setup area only — the red-team probe steps below are owned by their own
      # plan and are not touched here.
      - id: supabase-version
        run: echo "version=$(npx supabase --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')" >> "$GITHUB_OUTPUT"

      - id: supabase-images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/supabase-images.tar
          key: supabase-docker-images-${{ runner.os }}-${{ steps.supabase-version.outputs.version }}

      - name: Load cached Supabase Docker images
        run: if [ -f /tmp/supabase-images.tar ]; then docker load -i /tmp/supabase-images.tar; fi

      - name: Start ephemeral local Supabase
        run: npx supabase start

      # ubuntu-latest runners ship with no pre-pulled Docker images, so after `supabase start` the
      # image list is exactly the Supabase stack. Only saved on a cache miss; the cache action's
      # post-job save step uploads the tar for the next run.
      - name: Save Supabase Docker images for the next run
        if: always() && steps.supabase-images.outputs.cache-hit != 'true'
        run: |
          images=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>')
          if [ -n "$images" ]; then
            docker save $images -o /tmp/supabase-images.tar
          fi

      - name: Export local Supabase connection vars
        run: |
          npx supabase status -o env > .supabase-status.env
          # Supabase CLI emits shell-quoted values (e.g. NEXT_PUBLIC_SUPABASE_URL would end up as
          # a literal quoted string). Source its own generated env file instead of grep+cut, same
          # fix already applied to security-staging.yml (2026-08-29).
          set -a
          source .supabase-status.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PHASE1_STAGING_URL=http://localhost:3015"
            echo "PHASE1_TARGET_CONFIRMED=true"
            echo "SUPABASE_ADMIN_EMAILS=${CI_ADMIN_EMAIL}"
          } >> "$GITHUB_ENV"
          rm .supabase-status.env

      - run: npm test -- src/lib/security/__tests__/red-team-contract.test.ts

      - name: Start app (dev mode, ephemeral Supabase backend)
        run: nohup npm run dev > app.log 2>&1 &

      - name: Wait for app readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3015/api/health > /dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"; cat app.log; exit 1

      - name: Create ephemeral red-team users and derive session cookies
        run: npx tsx scripts/red-team/ephemeral-bootstrap.ts

      - run: npx tsx scripts/red-team/target-guard.ts
      - run: npx tsx scripts/red-team/rate-limit-bypass.ts
      - run: npx tsx scripts/red-team/admin-idor.ts
      # P1.4 origin-bypass (T_SECURITY_HARDENING/04 Runde 2, L5): three attack shapes against the
      # two-layer CSRF Origin-Guard on /api/casino/bet — forged Origin, missing Origin headers, and
      # a spoofed Sec-Fetch-Site header (only catchable by the route-level Layer 2 guard).
      - run: npx tsx scripts/red-team/origin-bypass.ts

      - name: Show app log on failure
        if: failure()
        run: cat app.log || true

      - name: Stop ephemeral local Supabase
        if: always()
        run: npx supabase stop
