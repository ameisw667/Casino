name: Security red team probes

# Redesigned 2026-08-28 (worldmap/00-09-CICD.md, M9 — same ephemeral-local-Supabase decision as
# security-staging.yml). Runs the app via `next dev` rather than a production build: the fail-closed
# rate-limit behavior in src/lib/security/request-security.ts (enforceRateLimit) only serves 503s
# once NODE_ENV=production and no Upstash is configured, which would make rate-limit-bypass.ts's
# probe meaningless in an ephemeral runner with no real Upstash instance. Dev mode uses the same
# tested in-memory rate-limit fallback Jan already relies on locally.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_ADMIN_EMAIL: ci-red-team-admin@ephemeral.test

jobs:
  red-team:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHA 2026-08-29 (worldmap/04_07_dependency_audit_gate.md L4), matching
      # quality-ci.yml and security-staging.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      - name: Start ephemeral local Supabase
        run: npx supabase start

      - name: Export local Supabase connection vars
        run: |
          npx supabase status -o env > .supabase-status.env
          # Supabase CLI emits shell-quoted values (e.g. NEXT_PUBLIC_SUPABASE_URL would end up as
          # a literal quoted string). Source its own generated env file instead of grep+cut, same
          # fix already applied to security-staging.yml (2026-08-29).
          set -a
          source .supabase-status.env
          set +a
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "PHASE1_STAGING_URL=http://127.0.0.1:3015"
            echo "PHASE1_TARGET_CONFIRMED=true"
            echo "SUPABASE_ADMIN_EMAILS=${CI_ADMIN_EMAIL}"
          } >> "$GITHUB_ENV"
          rm .supabase-status.env

      - run: npm test -- src/lib/security/__tests__/red-team-contract.test.ts

      - name: Start app (dev mode, ephemeral Supabase backend)
        env:
          ORIGIN_GUARD_DEBUG: 'true'
        run: nohup npm run dev > app.log 2>&1 &

      - name: Wait for app readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3015/api/health > /dev/null; then
              echo "App is up"; exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"; cat app.log; exit 1

      - name: Create ephemeral red-team users and derive session cookies
        run: npx tsx scripts/red-team/ephemeral-bootstrap.ts

      - name: Debug - raw curl to /api/casino/bet
        run: |
          curl -sv -X POST http://127.0.0.1:3015/api/casino/bet \
            -H "origin: http://127.0.0.1:3015" \
            -H "cookie: $RED_TEAM_AUTH_COOKIE" \
            -H "content-type: application/json" \
            -H "Idempotency-Key: $(node -e 'console.log(crypto.randomUUID())')" \
            -d '{}' 2>&1

      - run: npx tsx scripts/red-team/target-guard.ts
      - run: npx tsx scripts/red-team/rate-limit-bypass.ts
      - run: npx tsx scripts/red-team/admin-idor.ts

      - name: Show app log on failure
        if: failure()
        run: cat app.log || true

      - name: Stop ephemeral local Supabase
        if: always()
        run: npx supabase stop
