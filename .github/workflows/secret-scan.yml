name: Secret scan

# Added 2026-08-29 (worldmap/04_08_secret_rotation.md, L1). Scans the working tree (not full git
# history rewrite) for accidentally committed secrets (API keys, tokens, private keys) on every
# push/PR. Config in .gitleaks.toml — extends default rules with an allowlist for known
# .env.example placeholders. This is a hard gate (no continue-on-error): a real finding here
# blocks the merge.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to commit SHA 2026-08-29 (worldmap/04_07_dependency_audit_gate.md L4).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # gitleaks compares the pushed commit range. A shallow checkout cannot
          # resolve the pre-push parent and would silently perform only a partial scan.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
